[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nepal-empirical-flood-forecast"
version = "0.1.0"
description = "Experimental flood forecast for every river of Nepal from weather-model rain and Nepal's empirical flood formulas"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# The 2-hourly forecast needs only these: the heavy GIS work is done once by
# 'nepal-forecast prepare' and its results are committed in static/.
dependencies = ["numpy>=1.24", "pandas>=1.5", "pyyaml"]

[project.optional-dependencies]
gfs = ["eccodes>=2.37"]                 # the NOAA GFS (AWS) fallback rain source
prepare = ["pyflwdir>=0.5.8", "rasterio>=1.3", "geopandas>=0.14", "shapely>=2", "scipy",
           "h5py", "numba"]
test = ["pytest>=7"]

[project.scripts]
nepal-forecast = "nepal_forecast.cli:main"

[tool.setuptools.packages.find]
include = ["nepal_forecast*"]

[tool.setuptools.package-data]
nepal_forecast = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
