# Runs the forecast on GitHub's servers every 2 hours and publishes the site
# to the gh-pages branch (Settings -> Pages -> Deploy from a branch: gh-pages).
#
# If a computer of yours runs 'nepal-forecast serve' and publishes too, set the
# repository variable ONLY_IF_STALE_MIN (Settings -> Secrets and variables ->
# Actions -> Variables), e.g. 150: this job then runs only when the published
# forecast is older than that, as a backup.
#
# GitHub runs schedules on a best-effort basis (often some minutes late) and
# pauses them in a public repository after 60 days without activity.
name: flood-forecast
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: {group: flood-forecast, cancel-in-progress: false}
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[gfs]"   # editable: the code reads static/ from the checkout
      - name: Forecast update
        env:
          NEPAL_FORECAST_PUBLISH_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          STALE: ${{ vars.ONLY_IF_STALE_MIN }}
        run: |
          if [ -n "$STALE" ]; then
            nepal-forecast run --publish --only-if-stale "$STALE"
          else
            nepal-forecast run --publish
          fi
      - name: Status
        if: always()
        run: nepal-forecast status || true
